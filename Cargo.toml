[package]
name = "grass_shoots"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18", features = ["debug"] }
avian3d = "0.5"
rand = "0.10.0"

# CRITICAL FIX FOR WEB:
# Allows 'rand' to work in the browser by using JavaScript's Math.random()
getrandom = { version = "0.4", features = ["wasm_js"] }

# OPTIMIZATION (Required for Web):
# Without this, your game will be ~100MB+ and freeze the browser while loading.
[profile.release]
opt-level = "z"   # Optimize for small size
lto = true        # Enable Link Time Optimization
strip = true      # Remove debug symbols
codegen-units = 1 # Slower build, smaller binary
